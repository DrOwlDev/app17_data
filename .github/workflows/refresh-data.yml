name: Refresh Pages Data (legacy)

# Disabled as a product schedule — temperature archive collection is primary.
# Keep for manual debugging of the old markets.json Pages snapshot.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Export markets + temperature snapshot
        run: dart run tool/export_markets.dart web/data/markets.json

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update snapshot on Pages
        run: |
          mkdir -p gh-pages/data
          cp web/data/markets.json gh-pages/data/markets.json

      - name: Commit and push data
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Refresh markets snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:gh-pages
